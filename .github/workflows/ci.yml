name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and unit tests (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  install:
    name: Clean install from the package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm pack
      - name: Install the tarball in an empty prefix and run it
        shell: bash
        run: |
          prefix="$RUNNER_TEMP/rls-prefix"
          npm install --global --prefix "$prefix" ./riverloop-studio-*.tgz
          if [ "$RUNNER_OS" = "Windows" ]; then bin="$prefix/riverloop-studio.cmd"; else bin="$prefix/bin/riverloop-studio"; fi
          "$bin" --version
          "$bin" --lang en --help
          "$bin" --lang it --help

  e2e-web:
    name: End-to-end, web mode (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            chrome: /usr/bin/google-chrome
          - os: windows-latest
            chrome: C:\Program Files\Google\Chrome\Application\chrome.exe
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/create-e2e-app.mjs "${{ runner.temp }}/e2e-app"
      - run: npm run test:e2e -- --app "${{ runner.temp }}/e2e-app" --chromium "${{ matrix.chrome }}"
